; ============================================================================
;  SAWebUI - configuracion del runtime
; ============================================================================
;
;  Solo dos claves. Si algo no esta o esta mal, el runtime usa el default y lo
;  anota en SAWebUICef.log. Un INI ausente es el primer arranque normal.
;
;  Se lee al arrancar el juego: cambiarlo requiere reiniciar GTA SA.
;
;  Para apuntar una UI a un lugar puntual no hace falta tocar esto:
;      SAWeb.ui.register("panel", "C:/ruta/a/cualquier/index.html");
;
; ============================================================================

[SAWeb]

; Carpeta donde viven las paginas. Formas admitidas:
;   modloader\SAWebUI\web   relativa al juego
;   \carpeta           arraigada en la unidad del juego
;   D:\carpeta         absoluta
WebRoot = modloader\SAWebUI\web

; Pagina dentro de WebRoot. Debe ser relativa.
Index = index.html
